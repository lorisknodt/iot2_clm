name: IOT2_CLM - Run Tests

on:
  push:
    branches:
      - master
      - Test
  pull_request:
    branches:
      - master
      - Test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Cloner le dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer JDK pour Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Gradle pour accélérer les builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Rendre le script Gradle exécutable
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Exécuter les tests unitaires (uniquement sur la branche Test)
      - name: Run unit tests
        run: ./gradlew test
        if: github.ref == 'refs/heads/Test'

      # (Optionnel) Publier les rapports de test
      - name: Publish Test Reports
        if: always() && github.ref == 'refs/heads/Test'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/androidTest-results/